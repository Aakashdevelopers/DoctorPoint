<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaStore — Premium Digital Products & Downloads</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <i class="fa-solid fa-cube" style="color:var(--primary);"></i>
        <span>NovaStore</span>
        <span class="brand-badge">Digital</span>
      </a>
      <nav id="nav-links-dynamic" class="nav-links">
        <!-- Dynamic JS Navbar Links -->
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <span class="hero-tag"><i class="fa-solid fa-bolt"></i> Instant Digital Downloads</span>
      <h1>Discover Premium Digital Goods & Resources</h1>
      <p>Browse curated e-books, design assets, software templates, and courses. Instantly accessible upon purchase.</p>
      <a href="#store-section" class="btn btn-primary" style="padding: 0.9rem 2rem; font-size: 1.05rem;">
        Explore Store <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>
  </section>

  <!-- Store Section -->
  <main class="main-container" id="store-section">

    <!-- Search & Filters -->
    <div class="store-controls">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="search-input" placeholder="Search digital products, courses, ebooks...">
      </div>
      <div class="category-pills" id="category-pills">
        <button class="pill active" data-category="All">All Products</button>
      </div>
    </div>

    <!-- Product Cards Grid -->
    <div class="product-grid" id="product-grid">
      <!-- Loading Skeletons -->
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 NovaStore Digital Platform. All rights reserved. Powered by Node.js & Express.</p>
  </footer>

  <!-- Firebase & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/store.js"></script>

</body>
</html>
