<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — NovaStore</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: #f1f5f9;">

  <!-- Header -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <i class="fa-solid fa-cube" style="color:var(--primary);"></i>
        <span>NovaStore</span>
        <span class="brand-badge">Digital</span>
      </a>
      <nav id="nav-links-dynamic" class="nav-links">
        <!-- Dynamic JS Navbar Links -->
      </nav>
    </div>
  </header>

  <main class="main-container" style="max-width: 1240px; margin: 2rem auto;">

    <!-- Demo Mode Notice Banner -->
    <div class="demo-banner">
      <i class="fa-solid fa-flask"></i>
      <span><strong>Demo Mode Active:</strong> Instant purchase enabled without real payment processing. No financial transactions are made.</span>
    </div>

    <!-- SuperProfile Product Container -->
    <div id="product-detail-container">
      <!-- Loading Spinner -->
      <div style="text-align: center; padding: 4rem;"><i class="fa-solid fa-spinner fa-spin fa-2x" style="color: var(--primary);"></i></div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 NovaStore Digital Platform. All rights reserved.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/product.js"></script>

</body>
</html>
