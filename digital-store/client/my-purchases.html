<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Purchases — NovaStore</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <i class="fa-solid fa-cube" style="color:var(--primary);"></i>
        <span>NovaStore</span>
        <span class="brand-badge">Digital</span>
      </a>
      <nav id="nav-links-dynamic" class="nav-links">
        <!-- Dynamic JS Navbar Links -->
      </nav>
    </div>
  </header>

  <main class="main-container">
    <div style="margin-bottom: 2rem;">
      <h1 style="font-size: 2rem; font-weight: 800; color: var(--text-main);"><i class="fa-solid fa-folder-open" style="color:var(--primary);"></i> My Digital Library</h1>
      <p style="color: var(--text-muted);">Access and download your digital files anytime.</p>
    </div>

    <!-- Purchases List Container -->
    <div id="purchases-container" class="purchases-list">
      <div style="text-align: center; padding: 3rem;"><i class="fa-solid fa-spinner fa-spin fa-2x" style="color:var(--primary);"></i></div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 NovaStore Digital Platform. All rights reserved.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/my-purchases.js"></script>

</body>
</html>
